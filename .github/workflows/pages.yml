name: Publicar DocSpace no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Validar arquivos essenciais
        shell: bash
        run: |
          test -f frontend/index.html
          test -f frontend/script.js
          test -f frontend/style.css
          test -f frontend/modelos/catalogo-integrado.json

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Empacotar frontend estático
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
